<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sign in | AI For All Hackathon Demo Day Judging</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="icons.js"></script>
  <script src="theme.js"></script>
</head>

<body>
  <div class="auth-shell">
    <!-- Brand panel: the event, and the rubric judges will score against -->
    <aside class="auth-brand" id="brand-panel"></aside>

    <main class="auth-panel">
      <div class="auth-card">
        <h2 class="auth-heading">Sign in</h2>
        <p class="login-sub">Use the account the organizers gave you.</p>

        <!-- Notices shown while judging is outside its window -->
        <div id="pre-open-notice" class="pre-open-notice" hidden>
          <i data-icon="status-in-progress"></i>
          <span>Judging has not opened yet. Judge sign-in will unlock when judging opens.</span>
        </div>
        <div id="closed-notice" class="pre-open-notice closed" hidden>
          <i data-icon="lock-private"></i>
          <span>Judging has closed. Judge sign-in is no longer available.</span>
        </div>

        <div class="role-switch" role="group" aria-label="Sign in as">
          <button type="button" id="role-judge" class="active" onclick="setRole('judge')"><i data-icon="user-profile"></i> Judge</button>
          <button type="button" id="role-admin" onclick="setRole('admin')"><i data-icon="settings"></i> Admin</button>
        </div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" autocapitalize="off" autocorrect="off" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="pw-wrap">
              <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
              <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" aria-pressed="false" title="Show password"><i data-icon="eye"></i></button>
            </div>
          </div>
          <label class="check-row remember-row">
            <input type="checkbox" id="remember" checked />
            <span>Remember my login on this browser</span>
          </label>
          <button type="submit" class="btn btn-primary btn-lg btn-block" id="login-btn">
            <span id="login-btn-text">Sign in</span>
          </button>
          <div id="login-msg" class="msg" role="status" aria-live="polite"></div>
        </form>

        <p class="login-foot">Judge accounts are created by the admin. Contact the committee if you lost your credentials.</p>
      </div>
    </main>
  </div>

  <script src="criteria.js"></script>
  <script src="app.js"></script>
  <script src="brand.js"></script>
  <script>

    // Judging window (UTC+7 / WIB). Keep in sync with index.html and the server env vars.
    const OPEN_AT  = new Date('2026-11-06T00:00:00+07:00').getTime();
    const CLOSE_AT = new Date('2026-12-31T23:59:00+07:00').getTime();
    const now = Date.now();
    const BEFORE_OPEN = now < OPEN_AT;
    const AFTER_CLOSE = now >= CLOSE_AT;
    const JUDGING_OPEN = !BEFORE_OPEN && !AFTER_CLOSE;

    // Once judging has closed, judges are sent to the landing page, which shows the "Judging closed" notice.
    // Admins can still reach /login directly via ?admin=1.
    if (AFTER_CLOSE && !/[?&]admin=1/.test(location.search)) {
      location.replace('/');
    }

    // Outside the judging window, judge login is disabled here and on the server. Default to Admin then.
    let currentRole = JUDGING_OPEN ? 'judge' : 'admin';

    function setRole(role) {
      if (role === 'judge' && !JUDGING_OPEN) {
        document.getElementById('login-msg').textContent = AFTER_CLOSE
          ? 'Judging has closed. Judge sign-in is no longer available.'
          : 'Judge sign-in has not opened yet.';
        document.getElementById('login-msg').className = 'msg error';
        return;
      }
      currentRole = role;
      document.getElementById('role-judge').classList.toggle('active', role === 'judge');
      document.getElementById('role-admin').classList.toggle('active', role === 'admin');
      document.getElementById('login-msg').textContent = '';
      document.getElementById('login-msg').className = 'msg';
    }

    // Gate UI: flag Judge as locked and show the matching notice
    (function applyGateUI() {
      if (!JUDGING_OPEN) {
        document.getElementById(AFTER_CLOSE ? 'closed-notice' : 'pre-open-notice').hidden = false;
        const judgeBtn = document.getElementById('role-judge');
        judgeBtn.classList.remove('active');
        judgeBtn.classList.add('locked');
        judgeBtn.setAttribute('aria-disabled', 'true');
        judgeBtn.innerHTML = icon('lock-private') + ' Judge';
        document.getElementById('role-admin').classList.add('active');
      }
    })();

    // ---- Show / hide password ----
    (function passwordToggle() {
      const input = document.getElementById('password');
      const btn = document.getElementById('pw-toggle');
      btn.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.innerHTML = icon(show ? 'eye-off' : 'eye');
        btn.setAttribute('aria-pressed', String(show));
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        btn.setAttribute('title', show ? 'Hide password' : 'Show password');
        input.focus();
      });
    })();

    // ---- Remember my login: pre-fill the username and role used last time (never the password) ----
    const REMEMBER_KEY = 'pj_remember';
    (function restoreRemembered() {
      try {
        const rem = JSON.parse(localStorage.getItem(REMEMBER_KEY) || 'null');
        if (!rem) return;
        document.getElementById('remember').checked = true;
        if (rem.username) document.getElementById('username').value = rem.username;
        if (rem.role === 'admin' || (rem.role === 'judge' && JUDGING_OPEN)) setRole(rem.role);
        if (rem.username) document.getElementById('password').focus();
      } catch { /* ignore corrupt value */ }
    })();

    // If already logged in, go straight to the matching dashboard
    (function redirectIfLoggedIn() {
      const sess = Auth.get();
      if (sess?.user?.role === 'admin') location.href = '/admin';
      else if (sess?.user?.role === 'judge') location.href = '/juri';
    })();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const txt = document.getElementById('login-btn-text');
      const msg = document.getElementById('login-msg');
      msg.textContent = '';
      msg.className = 'msg';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) {
        msg.textContent = 'Please fill in both username and password.';
        msg.className = 'msg error';
        return;
      }

      btn.disabled = true;
      txt.textContent = 'Signing in...';
      try {
        const res = await fetch(API('/api/login'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ role: currentRole, username, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Sign-in failed.');

        const remember = document.getElementById('remember').checked;
        try {
          if (remember) localStorage.setItem(REMEMBER_KEY, JSON.stringify({ username, role: data.user.role }));
          else localStorage.removeItem(REMEMBER_KEY);
        } catch { /* storage blocked */ }
        Auth.set(data.token, data.user, remember);
        location.href = data.user.role === 'admin' ? '/admin' : '/juri';
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'msg error';
        btn.disabled = false;
        txt.textContent = 'Sign in';
      }
    });
  </script>
</body>

</html>
